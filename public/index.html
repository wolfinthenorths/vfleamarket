<body>
  <div class="app-shell">
    <header class="masthead">
      <a class="wordmark" href="#" aria-label="Блошиный рынок — главная"><img class="brand-cap" src="/assets/ui/nuka-cap.webp" width="44" height="44" alt="" fetchpriority="high"><span>DAWN OF THE DEAD<small>БЛОШИНЫЙ РЫНОК</small></span></a>

    <div class="service-note" id="service-note" hidden role="status"></div>
    <main id="main" tabindex="-1"><div class="loading-card">Открываем торговые ряды<span class="loading-dots">…</span></div></main>
    <footer class="colophon"><span>Starfield • 2238</span><span>Не дай хромому Джеку тебя надуть!</span></footer>
  </div>
  <nav class="bottom-nav" aria-label="Основная навигация">
    <a href="#" data-nav="market"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18M4 10v10h16V10M2 10l3-6h14l3 6M9 20v-6h6v6M8 4l-1 6m9-6 1 6"/></svg><span>Рынок</span></a>

    <a href="#inventory" data-nav="inventory"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6V4h8v2M7 6h10l3 5v10H4V11l3-5ZM4 12h16M9 15h6v4H9v-4Z"/></svg><span>Инвентарь</span></a>
  </nav>
  <dialog id="sheet" aria-labelledby="sheet-title"><div id="sheet-content"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
